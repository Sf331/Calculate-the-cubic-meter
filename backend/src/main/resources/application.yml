server:
  port: 8080

spring:
  datasource:
    # H2 内存库：数据活在 JVM 里，进程退出即消失，不需要装任何数据库。
    # MODE=MySQL 让 schema.sql 里的 MySQL 语法（AUTO_INCREMENT、KEY、COMMENT）能被解析。
    # DB_CLOSE_DELAY=-1 保证连接池回收连接后库不会被销毁。
    url: jdbc:h2:mem:kelifang;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      # 每次启动执行 schema.sql + data.sql。
      # schema.sql 里每张表都是 DROP TABLE IF EXISTS 打头，所以重启即重建，种子数据永远干净。
      mode: always
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

kelifang:
  # 上传文件的落盘位置。demo 就一个本地目录，没有需要外部改的理由，所以写死。
  storage-path: ./data/uploads
